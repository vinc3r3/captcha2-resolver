[project]
name = "captcha2-resolver"
version = "0.1.0"
description = "End-to-end pipeline for a text-captcha recognizer: collection, paid + LLM labeling, label correction, PaddleOCR fine-tuning and ONNX deployment."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Didar Kozhikov" }]
# Base install = inference only: ONNX Runtime + OpenCV (same resize as training) + NumPy.
dependencies = [
    "numpy>=1.24",
    "onnxruntime>=1.17",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
collect = ["requests>=2.31", "beautifulsoup4>=4.12", "python-dotenv>=1.0", "tqdm>=4.66"]
label = ["requests>=2.31", "python-dotenv>=1.0"]
data = ["pandas>=2.0", "datasets>=2.19", "huggingface_hub>=0.23", "pillow>=10.0", "python-dotenv>=1.0"]
# Training needs PaddlePaddle. Install the build for your machine separately (CPU / CUDA), see README.
train = ["pandas>=2.0", "pyyaml>=6.0", "paddleocr>=3.0"]
export = ["paddle2onnx>=2.0", "pyyaml>=6.0"]
hub = ["huggingface_hub>=0.23"]
dev = ["pytest>=8.0", "ruff>=0.6", "pre-commit>=3.7", "pandas>=2.0", "requests>=2.31", "beautifulsoup4>=4.12"]

[project.scripts]
c2r = "captcha2_resolver.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/captcha2_resolver"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B905"]  # zip(strict=) — predictions and labels may legitimately differ in length

[tool.pytest.ini_options]
testpaths = ["tests"]
